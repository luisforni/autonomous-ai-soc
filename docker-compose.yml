services:
  # -----------------------------------------------------------------------
  # Backend — FastAPI AI-SOC
  # -----------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aisoc-backend
    restart: unless-stopped
    ports:
      - "8888:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://soc:soc@postgres:5432/aisoc
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - aisoc

  # -----------------------------------------------------------------------
  # Frontend — Next.js 14
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aisoc-frontend
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - aisoc

  # -----------------------------------------------------------------------
  # PostgreSQL + TimescaleDB
  # -----------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: aisoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: aisoc
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d aisoc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aisoc

  # -----------------------------------------------------------------------
  # Redis
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aisoc-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aisoc

  # -----------------------------------------------------------------------
  # Elasticsearch
  # -----------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: aisoc-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - cluster.name=aisoc
      - bootstrap.memory_lock=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - aisoc

  # -----------------------------------------------------------------------
  # Kibana (SIEM UI sobre Elasticsearch)
  # -----------------------------------------------------------------------
  kibana:
    image: kibana:8.11.0
    container_name: aisoc-kibana
    restart: unless-stopped
    ports:
      - "5602:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - aisoc

  # -----------------------------------------------------------------------
  # Prometheus
  # -----------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: aisoc-prometheus
    restart: unless-stopped
    ports:
      - "9292:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - aisoc

  # -----------------------------------------------------------------------
  # Grafana
  # -----------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: aisoc-grafana
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aisoc2024
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - aisoc

volumes:
  postgres_data:
  redis_data:
  es_data:
  prometheus_data:
  grafana_data:

networks:
  aisoc:
    driver: bridge
