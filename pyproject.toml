[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-ai-soc"
version = "1.0.0"
description = "Centro de Operaciones de Ciberseguridad Autónomo — 126 AI agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "Luis Forni", email = "forni.luis@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    # Web
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # AI Providers
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "google-generativeai>=0.8.0",
    "mistralai>=1.0.0",
    "groq>=0.9.0",
    "cohere>=5.0.0",
    "boto3>=1.34.0",

    # Databases
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "elasticsearch[async]>=8.12.0",

    # Messaging
    "aiokafka>=0.10.0",

    # Security & Crypto
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # Cloud SDKs
    "azure-mgmt-security>=6.0.0",
    "azure-identity>=1.15.0",
    "azure-mgmt-monitor>=6.0.0",
    "google-cloud-securitycenter>=1.26.0",

    # Kubernetes & Docker
    "kubernetes>=29.0.0",
    "docker>=7.0.0",

    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",

    # Network & Analysis
    "scapy>=2.5.0",
    "dnspython>=2.6.0",
    "aiofiles>=23.2.1",
    "python-magic>=0.4.27",

    # Notifications
    "slack-sdk>=3.27.0",
    "aiosmtplib>=3.0.0",
    "jira>=3.8.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",
    "arrow>=1.3.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
